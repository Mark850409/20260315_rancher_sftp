apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp
  namespace: sftp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sftp
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sftp
    spec:
      containers:
        - name: sftp
          image: atmoz/sftp
          imagePullPolicy: Always
          args:
            # 使用者:密碼 或 使用者:密碼:uid:gid（請改為自己的值，勿將真實密碼提交至 Git）
            - zane:zane@1348:1001
          ports:
            - containerPort: 22
              name: 22tcp
              protocol: TCP
          volumeMounts:
            - name: sftp-storage
              mountPath: /home/zane/upload
            - name: ssh-key
              mountPath: /home/zane/.ssh/authorized_keys
              readOnly: true
              subPath: authorized_keys
      volumes:
        - name: sftp-storage
          persistentVolumeClaim:
            claimName: sftp-pvc
        - name: ssh-key
          secret:
            secretName: sftp-key
            defaultMode: 0420
